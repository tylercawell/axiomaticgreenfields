services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: axiomatic-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - axiomatic

  nginx:
    image: nginx:alpine
    container_name: axiomatic-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - axiomatic

  mysql:
    image: mysql:8.4
    container_name: axiomatic-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: axiomatic
      MYSQL_USER: axiomatic
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - axiomatic

  node:
    image: node:22-alpine
    container_name: axiomatic-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - axiomatic

networks:
  axiomatic:

volumes:
  mysql_data: